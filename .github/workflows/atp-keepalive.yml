name: ATP keep-alive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/lp-atp-driver" --ignore-scripts --no-save oracledb@6.10.0
      - run: node oracle/atp/keepalive.mjs
        env:
          ATP_USER: ${{ secrets.ATP_USER }}
          ATP_PASSWORD: ${{ secrets.ATP_PASSWORD }}
          ATP_CONNECT_STRING: ${{ secrets.ATP_CONNECT_STRING }}
          ATP_ORACLEDB_MODULE_DIR: ${{ runner.temp }}/lp-atp-driver/node_modules/oracledb
