name: Dashboard to GitHub Pages

# Manual only: this workflow never runs on push or pull request.
#
# GitHub Pages for a private repository needs a paid plan. On the free plan the
# site requires a public repository, so either publish this dashboard from a
# separate public repository or host `apps/dashboard/dist` on Cloudflare Pages.
#
# Configure repository variables (Settings -> Secrets and variables -> Actions
# -> Variables): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, and optionally
# VITE_BASE_PATH (for example "/lplatform-dashboard/") when the site is served
# from a project subpath. No secret is used: the anon key is public by design
# and RLS enforces every read and write.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FUNCTIONS_URL: ${{ vars.VITE_FUNCTIONS_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: pnpm --filter @lplatform/dashboard build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
