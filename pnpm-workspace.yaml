packages:
  - apps/*
  - packages/*
  - oracle/atp

allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  oracledb: false

overrides:
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  postcss: '>=8.5.23'
